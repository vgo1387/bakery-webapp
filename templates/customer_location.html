{% extends "base.html" %}
{% block title %}ثبت مکان{% endblock %}

{% block content %}
<div class="loc-page">
    <div class="loc-card">
        <h1>📍 ثبت مکان شما</h1>
        <p class="muted">برای پیدا کردن نانوایی‌های نزدیک، لطفاً موقعیت خود را روی نقشه مشخص کنید.</p>

        <div id="locMap" class="loc-map" dir="ltr"></div>
        <p id="locPicked" class="loc-picked">مکان انتخاب‌شده: <b dir="ltr">—</b></p>

        <div class="loc-actions">
            <button id="btnGps" class="btn-secondary"
                    onclick="useMyLocation()">📱 موقعیت من (GPS)</button>
            <button id="btnSave" class="btn-primary"
                    onclick="saveLocation()">✓ تأیید و ثبت مکان</button>
        </div>
        <p id="locError" class="error-msg hidden"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_v('leaflet/leaflet.js') }}" onerror="document.getElementById('locError').textContent='خطا در بارگذاری نقشه'; document.getElementById('locError').classList.remove('hidden')"></script>
<script>
(function() {
    // ── اگر صفحه index باشد initMapApp اجرا نمی‌شود (چک بر اساس locMap) ──
    var mapEl = document.getElementById('locMap');
    if (!mapEl) { return; }

    var map, marker;
    try {
        map = L.map('locMap', { zoomControl: true, attributionControl: true })
            .setView([35.7448, 51.3753], 13);

        // منابع کاشی: OSM اصلی (تست‌شده از شبکه کاربر) + CARTO یدکی؛ سوئیچ فقط یک بار و فقط در خطای زیاد
        var TILES = [
            window.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png'
        ];
        var tileIndex = 0;
        var errCount = 0;
        var switched = false;

        function addTileLayer() {
            L.tileLayer(TILES[tileIndex], {
                maxZoom: 19,
                detectRetina: false,
                errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAPLtJgAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==',
                attribution: '\u00a9 OpenStreetMap'
            }).on('tileerror', function() {
                errCount++;
                // فقط بعد از ۴ خطای متوالی منبع را عوض کن و فقط یک بار!
                if (errCount >= 4 && !switched && tileIndex < TILES.length - 1) {
                    switched = true;
                    tileIndex++;
                    errCount = 0;
                    map.eachLayer(function(l) { if (l instanceof L.TileLayer) map.removeLayer(l); });
                    addTileLayer();
                } else if (errCount >= 6 && switched) {
                    document.getElementById('locError').textContent = 'خطا در بارگذاری نقشه — اتصال اینترنت را بررسی کنید';
                    document.getElementById('locError').classList.remove('hidden');
                }
            }).addTo(map);
        }
        addTileLayer();

        // بعد از رندر کامل، اندازه نقشه را دوباره محاسبه کن تا کاشی‌ها درست جای‌گیری شوند
        setTimeout(function() { if (map) map.invalidateSize(); }, 200);
        window.addEventListener('resize', function() { if (map) map.invalidateSize(); });

        var iconOptions = {
            iconUrl: 'data:image/svg+xml;base64,' + btoa(
                '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">' +
                '<circle cx=\"50\" cy=\"50\" r=\"45\" fill=\"#dc3545\"/>' +
                '<circle cx=\"50\" cy=\"38\" r=\"18\" fill=\"white\"/>' +
                '<ellipse cx=\"50\" cy=\"78\" rx=\"16\" ry=\"8\" fill=\"white\" opacity=\".4\"/>' +
                '</svg>'
            ),
            iconSize: [40, 52],
            iconAnchor: [20, 52],
            popupAnchor: [0, -52]
        };
        marker = L.marker([35.7448, 51.3753], { draggable: true, icon: L.icon(iconOptions) }).addTo(map);
    } catch(e) {
        document.getElementById('locError').textContent = 'خطا در بارگذاری نقشه: ' + (e.message || 'ناشناخته');
        document.getElementById('locError').classList.remove('hidden');
        return;
    }

    function syncFields() {
        var pos = marker.getLatLng();
        document.querySelector('#locPicked b').textContent = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);
    }
    syncFields();

    marker.on('dragend', syncFields);
    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        syncFields();
    });

    function useMyLocation() {
        if (!navigator.geolocation) {
            alert('مرورگر شما GPS را پشتیبانی نمی‌کند');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                var ll = [pos.coords.latitude, pos.coords.longitude];
                map.setView(ll, 15);
                marker.setLatLng(ll);
                syncFields();
            },
            function(err) { alert('اجازه دسترسی به موقعیت داده نشد'); },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    {% if user and user.latitude %}
    try {
        map.setView([{{ user.latitude }}, {{ user.longitude }}], 15);
        marker.setLatLng([{{ user.latitude }}, {{ user.longitude }}]);
        syncFields();
    } catch(e) {}
    {% endif %}

    async function saveLocation() {
        var pos = marker.getLatLng();
        var errEl = document.getElementById('locError');
        errEl.classList.add('hidden');
        try {
            var res = await fetch('/api/customer/location/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: pos.lat, longitude: pos.lng })
            });
            var data = await res.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                errEl.textContent = data.error || 'خطا در ثبت مکان';
                errEl.classList.remove('hidden');
            }
        } catch(e) {
            errEl.textContent = 'خطای شبکه';
            errEl.classList.remove('hidden');
        }
    }

    // make saveLocation globally available for onclick
    window.saveLocation = saveLocation;
    window.useMyLocation = useMyLocation;
})();
</script>
{% endblock %}
