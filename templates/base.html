<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}نانوبت — رزرو آنلاین نان{% endblock %}</title>

    <meta name="description" content="نانوبت — پیدا کردن نانوایی نزدیک، رزرو نوبت آنلاین و دریافت نان">
    <meta name="theme-color" content="#2d5016">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="نانوبت — رزرو آنلاین نان">
    <meta property="og:description" content="پیدا کردن نانوایی نزدیک، رزرو نوبت و دریافت نان">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/static/icons/icon-192.png">
    <meta property="og:locale" content="fa_IR">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a href="#" id="installBtn" class="install-prompt hidden">⬇ نصب برنامه روی دستگاه شما</a>
    <button id="backFab" class="back-fab" title="بازگشت" aria-label="بازگشت"
            onclick="if (history.length > 1) { history.back(); } else { location.href = '/'; }">→</button>

    {% block page_header %}{% endblock %}

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    {% block page_footer %}{% endblock %}

    <script>window.TILE_URL = {{ (tile_url or 'https://tile.openstreetmap.org/{z}/{x}/{y}.png')|tojson }};</script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}

    <script>
        // ثبت Service Worker برای نصب به‌عنوان اپ
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (e) {
                    console.log('SW registration failed', e);
                });
            });
        }
        // دکمه نصب PWA
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });
        document.getElementById('installBtn').addEventListener('click', async function (e) {
            e.preventDefault();
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            if (choice.outcome === 'dismissed') { /* کاربر انصراف داد */ }
            deferredPrompt = null;
            document.getElementById('installBtn').classList.add('hidden');
        });
    </script>

    {% if user %}
    <script>
        // بررسی اعلان‌های «آماده شد» هر ۱۵ ثانیه
        async function refreshBell() {
            try {
                const res = await fetch('/api/notifications/count');
                const data = await res.json();
                const badge = document.getElementById('bellBadge');
                if (badge && data.count > 0) {
                    badge.textContent = data.count.toLocaleString('fa-IR');
                    badge.classList.remove('hidden');
                } else if (badge) {
                    badge.classList.add('hidden');
                }
            } catch (e) {}
        }
        refreshBell();
        setInterval(refreshBell, 15000);
    </script>
    {% endif %}
</body>
</html>
