{% extends "base.html" %}
{% block title %}ورود مشتری{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>ورود / ثبت‌نام</h1>
        <p class="auth-sub">برای دریافت نوبت، شماره موبایل خود را وارد کنید.</p>

        <div id="stepPhone">
            <div class="form-group">
                <label for="loginPhone">شماره موبایل</label>
                <input type="tel" id="loginPhone" class="input" placeholder="مثلاً 09123456789" dir="ltr">
            </div>
            <button id="loginBtn" onclick="quickLogin()" class="btn-primary btn-block">ورود</button>

            <!-- کد تأیید پیامکی: فعلاً غیرفعال — به‌زودی فعال می‌شود -->
            <div class="form-group code-disabled-box">
                <label for="loginCode">کد تأیید پیامکی</label>
                <input type="text" id="loginCode" class="input" placeholder="کد ۴ رقمی" dir="ltr" maxlength="4" disabled>
                <p class="code-note">🔔 به‌زودی فعال می‌شود — فعلاً فقط با شماره وارد شوید</p>
            </div>

            <p id="otpError" class="error-msg hidden"></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function quickLogin() {
    const phone = document.getElementById('loginPhone').value.trim();
    const err = document.getElementById('otpError');
    if (!/^09\d{9}$/.test(phone)) {
        err.textContent = 'شماره موبایل معتبر وارد کنید';
        err.classList.remove('hidden');
        return;
    }
    err.classList.add('hidden');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    try {
        const res = await fetch('/api/otp/request', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone: phone, channel: 'sms'})
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = data.need_location ? '/customer/location' : '/';
        } else {
            err.textContent = data.error || 'خطا در ورود';
            err.classList.remove('hidden');
            btn.disabled = false;
        }
    } catch (e) {
        err.textContent = 'خطای شبکه';
        err.classList.remove('hidden');
        btn.disabled = false;
    }
}
// Enter هم کار کند
document.getElementById('loginPhone').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') quickLogin();
});
</script>
{% endblock %}
