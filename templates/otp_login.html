{% extends "base.html" %}
{% block title %}ورود مشتری{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>ورود / ثبت‌نام</h1>
        <p class="auth-sub">برای دریافت نوبت، شماره موبایل خود را وارد کنید.</p>

        <!-- مرحله ۱: شماره -->
        <div id="stepPhone">
            <div class="form-group">
                <label for="loginPhone">شماره موبایل</label>
                <input type="tel" id="loginPhone" class="input" placeholder="مثلاً 09123456789" dir="ltr">
            </div>
            <button onclick="goConfirm()" class="btn-primary btn-block">ادامه</button>
            <p id="otpError" class="error-msg hidden"></p>
        </div>

        <!-- مرحله ۲: تأیید شماره -->
        <div id="stepConfirm" class="hidden">
            <p class="confirm-text">شماره شما درست است؟</p>
            <p class="confirm-phone" dir="ltr" id="phoneEcho"></p>
            <button onclick="goChannel()" class="btn-primary btn-block">✓ تأیید شماره</button>
            <button onclick="showStep('stepPhone')" class="btn-secondary btn-block" style="margin-top:0.6rem">ویرایش شماره</button>
        </div>

        <!-- مرحله ۳: انتخاب روش ارسال -->
        <div id="stepChannel" class="hidden">
            <p class="confirm-text">کد تأیید از کجا ارسال شود؟</p>
            <div class="channel-grid">
                <button onclick="sendCode('sms')" class="channel-btn">📨 پیامک</button>
                <button onclick="sendCode('bale')" class="channel-btn">🟢 بله</button>
                <button onclick="sendCode('eitaa')" class="channel-btn">🟡 ایتا</button>
                <button onclick="sendCode('rubika')" class="channel-btn">🔴 روبیکا</button>
            </div>
            <button onclick="showStep('stepConfirm')" class="btn-secondary btn-block" style="margin-top:0.8rem">→ بازگشت</button>
            <p id="channelError" class="error-msg hidden"></p>
        </div>

        <!-- مرحله ۴: وارد کردن کد -->
        <div id="stepCode" class="hidden">
            <div class="form-group">
                <label for="loginCode">کد تأیید</label>
                <input type="text" id="loginCode" class="input" placeholder="کد ۴ رقمی" dir="ltr" maxlength="4">
            </div>
            <button onclick="verifyOtp()" class="btn-primary btn-block">ورود</button>
            <button onclick="resendCode()" class="btn-secondary btn-block" style="margin-top:0.6rem">ارسال مجدد کد</button>
            <button onclick="showStep('stepChannel')" class="btn-secondary btn-block" style="margin-top:0.4rem">→ بازگشت</button>
            <p id="verifyError" class="error-msg hidden"></p>
            <div id="devCodeBox" class="mock-banner hidden">
                حالت آزمایشی — کد شما: <b id="devCode" dir="ltr"></b>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const STEPS = ['stepPhone', 'stepConfirm', 'stepChannel', 'stepCode'];
let currentPhone = '';
let lastChannel = 'sms';

function showStep(id) {
    STEPS.forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
    });
}

function goConfirm() {
    const phone = document.getElementById('loginPhone').value.trim();
    const err = document.getElementById('otpError');
    if (!/^09\d{9}$/.test(phone)) {
        err.textContent = 'شماره موبایل معتبر وارد کنید';
        err.classList.remove('hidden');
        return;
    }
    err.classList.add('hidden');
    currentPhone = phone;
    document.getElementById('phoneEcho').textContent = phone;
    showStep('stepConfirm');
}

function goChannel() {
    showStep('stepChannel');
}

async function sendCode(channel) {
    const err = document.getElementById('channelError');
    err.classList.add('hidden');
    const res = await fetch('/api/otp/request', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone: currentPhone, channel})
    });
    const data = await res.json();
    if (data.success) {
        lastChannel = channel;
        showStep('stepCode');
        const box = document.getElementById('devCodeBox');
        if (data.dev_code) {
            document.getElementById('devCode').textContent = data.dev_code;
            box.classList.remove('hidden');
        } else {
            box.classList.add('hidden');
        }
        document.getElementById('loginCode').focus();
    } else {
        err.textContent = data.error || 'خطا در ارسال کد';
        err.classList.remove('hidden');
    }
}

function resendCode() {
    showStep('stepChannel');
    sendCode(lastChannel);
}

async function verifyOtp() {
    const code = document.getElementById('loginCode').value.trim();
    const err = document.getElementById('verifyError');
    err.classList.add('hidden');
    const res = await fetch('/api/otp/verify', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone: currentPhone, code})
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/';
    } else {
        err.textContent = data.error || 'کد نامعتبر است';
        err.classList.remove('hidden');
    }
}
</script>
{% endblock %}
