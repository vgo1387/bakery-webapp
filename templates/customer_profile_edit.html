{% extends "base.html" %}
{% block title %}ویرایش پروفایل{% endblock %}

{% block page_header %}
<header class="mini-header">
    <div class="mini-header-content">
        <a href="/" class="logo"><img src="/static/icons/icon-192.png" class="logo-icon" alt="نانوبت"> نانوبت</a>
        <a href="/customer/settings" class="nav-link">→ تنظیمات</a>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="settings-page">
    <h1>✏️ ویرایش پروفایل</h1>

    <div class="settings-card">
        <div class="form-group">
            <label for="editName">نام و نام‌خانوادگی</label>
            <input type="text" id="editName" class="input" value="{{ user.name or '' }}" placeholder="مثلاً علی محمدی">
        </div>
        <div class="form-group">
            <label>شماره موبایل (غیرقابل تغییر)</label>
            <input type="text" class="input" value="{{ user.phone }}" dir="ltr" disabled>
        </div>
        <button class="btn-primary btn-block" onclick="saveProfile()">ذخیره</button>
        <a href="/customer/settings" class="btn-secondary btn-block" style="margin-top:0.6rem">بازگشت</a>
        <p id="profileError" class="error-msg hidden"></p>
    </div>
</div>
{% endblock %}

{% block page_footer %}
<nav class="tab-bar">
    <a href="/" class="tab-item"><span class="tab-icon">🏪</span><span class="tab-label">نانوایی‌ها</span></a>
    <a href="/my-reservations" class="tab-item"><span class="tab-icon">📋</span><span class="tab-label">نوبت‌ها</span></a>
    <a href="/customer/settings" class="tab-item active"><span class="tab-icon">⚙️</span><span class="tab-label">تنظیمات</span></a>
</nav>
{% endblock %}

{% block scripts %}
<script>
async function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const errEl = document.getElementById('profileError');
    errEl.classList.add('hidden');
    try {
        const res = await fetch('/api/customer/profile/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/customer/settings';
        } else {
            errEl.textContent = data.error || 'خطا در ذخیره';
            errEl.classList.remove('hidden');
        }
    } catch (e) {
        errEl.textContent = 'خطای شبکه';
        errEl.classList.remove('hidden');
    }
}
</script>
{% endblock %}
